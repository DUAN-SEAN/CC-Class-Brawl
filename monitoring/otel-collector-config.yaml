receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  resource:
    attributes:
      - key: service.name
        value: "claude-code"
        action: upsert
      - key: environment
        value: "development"
        action: upsert

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    send_timestamps: true
    resource_to_telemetry_conversion:
      enabled: true
  debug:
    verbosity: basic
    sampling_initial: 100
    sampling_thereafter: 100
  otlphttp:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [debug, otlphttp]
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [debug]
