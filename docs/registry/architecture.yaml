# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: script_execution_order_for_fsm_coordination
    status: active
    description: "FSM coordination must use explicit call ordering (CharacterController mediator),
      not Unity's Script Execution Order project setting."
    why: "Script Execution Order is a global project setting not visible in code. Explicit
      call ordering self-documents dependencies and is easier to maintain."
    adr: docs/architecture/adr-0002-dual-fsm-architecture.md
    added: 2026-05-24

  - pattern: manual_collision_detection_for_hitbox
    status: active
    description: "Do not implement manual AABB overlap checking for hitbox/hurtbox
      detection. Use Unity Physics2D Trigger system with Layer Collision Matrix instead."
    why: "Manual AABB duplicates Unity's built-in collision work. Trigger callbacks
      are native to physics step timing and naturally deduplicate per-overlap. Adding
      manual detection adds code complexity without performance benefit for <10 colliders."
    adr: docs/architecture/adr-0003-hitbox-hurtbox-detection.md
    added: 2026-05-24

  - pattern: hardcoded_gameplay_data
    status: active
    description: "Gameplay values (movement params, attack frames, damage, knockback,
      skill stats) must not be hardcoded as C# constants or static fields. All game
      data must be defined in ScriptableObject assets (ClassData, SkillData, ArenaConfig)."
    why: "Fighting game balance requires frequent numerical tuning; hardcoded values
      force recompile-rebuild-test cycles that are too slow for iterative balancing.
      SO enables designers to adjust values in Inspector without programmer involvement."
    adr: docs/architecture/adr-0004-skill-system-data-driven.md
    added: 2026-05-24

  - pattern: sendmessage_input_routing
    status: active
    description: "PlayerInput must not use Behavior = SendMessage. Use InvokeCSharpEvents
      (or InvokeUnityEvents as second choice) instead."
    why: "SendMessage uses reflection to call methods by name, introducing per-frame GC
      allocation and non-deterministic overhead. Fighting games require predictable,
      minimal-latency input processing. InvokeCSharpEvents is pure C# delegate dispatch."
    adr: docs/architecture/adr-0005-input-system.md
    added: 2026-05-24

