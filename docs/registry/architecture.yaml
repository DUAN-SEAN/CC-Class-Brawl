# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: movement_coordination
    status: active
    pattern: direct_call
    producer: combat-fsm
    consumers:
      - movement-controller
    adr: docs/architecture/adr-0002-dual-fsm-architecture.md
    signal_signature: "IMovementController.FreezeMovement(bool) / SetVelocity(Vector2)"
    referenced_by:
      - docs/architecture/adr-0002-dual-fsm-architecture.md
      - design/gdd/combat-state-machine.md
    added: 2026-05-24
    revised: ""

