# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - target_fps: 60
    total_frame_budget_ms: 16.6
    platform: PC
    adr: docs/architecture/adr-0001-physics-timestep.md
    added: 2026-05-24
    revised: ""

  - system: physics_total
    status: active
    budget_ms: 3.0
    adr: docs/architecture/adr-0001-physics-timestep.md
    notes: "Combined budget for 3C movement + collision detection + knockback physics at 60Hz"
    referenced_by:
      - docs/architecture/adr-0001-physics-timestep.md
    added: 2026-05-24
    revised: ""

