# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: physics_velocity_assignment
    status: active
    api: Rigidbody2D.velocity = newVelocity
    not: Rigidbody2D.AddForce()
    adr: docs/architecture/adr-0001-physics-timestep.md
    reason: "Frame-exact velocity control required for fighting game — AddForce has one-frame delay and non-deterministic results through Box2D solver"
    referenced_by:
      - docs/architecture/adr-0001-physics-timestep.md
    added: 2026-05-24
    revised: ""

  - purpose: physics_gravity
    status: active
    api: Manual gravity in FixedUpdate (velocity.y -= Gravity * dt)
    not: Rigidbody2D.gravityScale
    adr: docs/architecture/adr-0001-physics-timestep.md
    reason: "Per-state gravity multiplier support (fast-fall 2.2x, normal 1.0x); precise terminal velocity clamping; transparent, testable formula"
    referenced_by:
      - docs/architecture/adr-0001-physics-timestep.md
    added: 2026-05-24
    revised: ""

  - purpose: physics_timestep
    status: active
    api: Time.fixedDeltaTime = 1/60 via Project Settings
    not: Unity default 50Hz (0.02s)
    adr: docs/architecture/adr-0001-physics-timestep.md
    reason: "Fighting game requires physics step frequency to match frame animation (60fps) for frame-exact hit detection and input buffering"
    referenced_by:
      - docs/architecture/adr-0001-physics-timestep.md
    added: 2026-05-24
    revised: ""

  - purpose: hitbox_hurtbox_detection
    status: active
    api: Unity Physics2D OnTriggerEnter2D + Layer Collision Matrix
    not: Manual AABB overlap checking, Physics2D.OverlapBox polling
    adr: docs/architecture/adr-0003-hitbox-hurtbox-detection.md
    reason: "Trigger callbacks are native to physics step timing, naturally deduplicate per-overlap, and Layer Matrix filters at engine level. Manual AABB duplicates Unity's built-in collision work."
    referenced_by:
      - docs/architecture/adr-0003-hitbox-hurtbox-detection.md
    added: 2026-05-24
    revised: ""

  - purpose: physics_auto_sync_transforms
    status: active
    api: Physics2D.autoSyncTransforms = true
    not: false with manual Physics2D.SyncTransforms() calls
    adr: docs/architecture/adr-0003-hitbox-hurtbox-detection.md
    reason: "Eliminates Transform sync timing bugs for hitbox positioning. Performance cost negligible with <10 colliders."
    referenced_by:
      - docs/architecture/adr-0003-hitbox-hurtbox-detection.md
    added: 2026-05-24
    revised: ""

  - purpose: gameplay_data_storage
    status: active
    api: ScriptableObject (ClassData, SkillData, ArenaConfig)
    not: JSON/CSV external files, C# hardcoded constants
    adr: docs/architecture/adr-0004-skill-system-data-driven.md
    reason: "SO enables Unity Inspector editing for designers; data-driven approach allows content creation without code changes; MVP data volume (<20 assets) does not need external toolchain complexity"
    referenced_by:
      - docs/architecture/adr-0004-skill-system-data-driven.md
      - design/gdd/skill-database.md
      - design/gdd/class-system.md
    added: 2026-05-24
    revised: ""

  - purpose: state_definition_type
    status: active
    api: readonly struct StateDefinition (stack-allocated, zero GC)
    not: ScriptableObject for runtime FSM registration data
    adr: docs/architecture/adr-0004-skill-system-data-driven.md
    reason: "StateDefinition is transient runtime data created from SkillData.AttackData; does not need Unity serialization or Inspector editing; readonly struct guarantees immutability and zero GC pressure"
    referenced_by:
      - docs/architecture/adr-0004-skill-system-data-driven.md
      - docs/architecture/adr-0002-dual-fsm-architecture.md
    added: 2026-05-24
    revised: ""

  - purpose: input_system
    status: active
    api: com.unity.inputsystem 1.7.x (New Input System)
    not: Legacy Input Manager (Input.GetAxis/GetButton)
    adr: docs/architecture/adr-0005-input-system.md
    reason: "Legacy Input Manager cannot distinguish multiple same-type devices (two gamepads); no event-driven callbacks; no Control Schemes; API in maintenance mode"
    referenced_by:
      - docs/architecture/adr-0005-input-system.md
      - design/gdd/3c-system.md
    added: 2026-05-24
    revised: ""

  - purpose: player_input_behavior
    status: active
    api: PlayerInput with Behavior = InvokeCSharpEvents
    not: SendMessage (default), InvokeUnityEvents
    adr: docs/architecture/adr-0005-input-system.md
    reason: "SendMessage uses reflection with performance overhead; InvokeCSharpEvents is pure C# delegate, zero reflection, best performance for frame-exact fighting game input"
    referenced_by:
      - docs/architecture/adr-0005-input-system.md
    added: 2026-05-24
    revised: ""

  - purpose: input_device_pairing
    status: active
    api: PlayerInput + PlayerInputManager with Control Schemes
    not: Manual Gamepad.all[] indexing, direct InputUser management
    adr: docs/architecture/adr-0005-input-system.md
    reason: "PlayerInputManager encapsulates device discovery, pairing, and Control Scheme auto-switching. Manual device indexing breaks when devices disconnect/reconnect (index order is non-deterministic)."
    referenced_by:
      - docs/architecture/adr-0005-input-system.md
      - design/gdd/3c-system.md
    added: 2026-05-24
    revised: ""

