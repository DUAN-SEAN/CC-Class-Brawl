# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: damage_percent_update
    status: active
    source: design/gdd/damage-calculation-system.md
    referenced_by:
      - design/gdd/damage-calculation-system.md
    variables:
      - TargetDamagePercent_old
      - BaseDamage
    output_range: [0.0, 999.0+]
    expression: "TargetDamagePercent_new = TargetDamagePercent_old + BaseDamage"
    notes: "Simple additive damage accumulation. Output feeds into knockback formula and HUD display."
    added: 2026-05-23
    revised: ""

  - name: knockback_magnitude
    status: active
    source: design/gdd/damage-calculation-system.md
    referenced_by:
      - design/gdd/damage-calculation-system.md
      - design/gdd/knockback-launch-system.md
    variables:
      - BaseKnockback
      - TargetDamagePercent
      - BaseKnockbackGrowth
    output_range: [BaseKnockback, 50+]
    expression: "KnockbackMagnitude = BaseKnockbackGrowth × (TargetDamagePercent / 100) × BaseKnockback + BaseKnockback"
    notes: "Knockback scales with target's damage percentage. At 0% knockback equals BaseKnockback. Output feeds into knockback system and FSM state transition."
    added: 2026-05-23
    revised: ""

  - name: display_percent_rounding
    status: active
    source: design/gdd/damage-calculation-system.md
    referenced_by:
      - design/gdd/damage-calculation-system.md
    variables:
      - TargetDamagePercent
    output_range: [0, 999]
    expression: "DisplayPercent = Floor(TargetDamagePercent)"
    notes: "Display-only rounding for HUD. Internal precision is float."
    added: 2026-05-23
    revised: ""

  - name: knockback_vector
    status: active
    source: design/gdd/knockback-launch-system.md
    referenced_by:
      - design/gdd/knockback-launch-system.md
    variables:
      - KnockbackMagnitude
      - KnockbackLaunchRatio
      - KnockbackSpeedMultiplier
      - horizontalDir
    output_range: [1.0, 35+]
    expression: "KnockbackVector = normalize(Vector2(horizontalDir, KnockbackLaunchRatio)) × KnockbackMagnitude × KnockbackSpeedMultiplier"
    notes: "Converts scalar knockback magnitude to directional velocity vector. Output feeds into 3C SetVelocity."
    added: 2026-05-23
    revised: ""

  - name: hitstun_velocity_update
    status: active
    source: design/gdd/knockback-launch-system.md
    referenced_by:
      - design/gdd/knockback-launch-system.md
    variables:
      - Vx
      - Vy
      - KnockbackDecayRate
      - Gravity
      - TerminalVelocity
    output_range: "Vx decays toward 0; Vy clamped to [-TerminalVelocity, +inf]"
    expression: "Vx_new = Vx × KnockbackDecayRate; Vy_new = Max(Vy - Gravity × dt, -TerminalVelocity)"
    notes: "Per-frame velocity update during knockback hitstun period. Gravity and decay applied independently."
    added: 2026-05-23
    revised: ""

  - name: recovery_velocity_update
    status: active
    source: design/gdd/knockback-launch-system.md
    referenced_by:
      - design/gdd/knockback-launch-system.md
    variables:
      - Vx
      - MaxAirSpeed
      - KnockbackRecoveryRate
    output_range: "[0, MaxAirSpeed] after recovery completes"
    expression: "if |Vx| > MaxAirSpeed: Vx × KnockbackRecoveryRate; else: 3C air control"
    notes: "Post-hitstun velocity decay until within 3C MaxAirSpeed. Faster decay than hitstun period."
    added: 2026-05-23
    revised: ""

  - name: blast_zone_ko_check
    status: active
    source: design/gdd/knockback-launch-system.md
    referenced_by:
      - design/gdd/knockback-launch-system.md
    variables:
      - position_x
      - position_y
      - BlastLeft
      - BlastRight
      - BlastTop
      - BlastBottom
    output_range: [false, true]
    expression: "IsKO = (position.x < BlastLeft) OR (position.x > BlastRight) OR (position.y < BlastBottom) OR (position.y > BlastTop)"
    notes: "Strict inequality — on boundary does not trigger KO. Checked every frame during knockback and recovery."
    added: 2026-05-23
    revised: ""

  - name: focus_gain_attacker
    status: active
    source: design/gdd/focus-system.md
    referenced_by:
      - design/gdd/focus-system.md
    variables:
      - BaseDamage
      - FocusGainRate_Attacker
    output_range: [0.9, 4.5]
    expression: "FocusGain_Attacker = BaseDamage × FocusGainRate_Attacker"
    notes: "Attacker focus gain per hit. Output feeds into focus_update_and_unlock."
    added: 2026-05-23
    revised: ""

  - name: focus_gain_defender
    status: active
    source: design/gdd/focus-system.md
    referenced_by:
      - design/gdd/focus-system.md
    variables:
      - BaseDamage
      - FocusGainRate_Defender
    output_range: [0.3, 1.5]
    expression: "FocusGain_Defender = BaseDamage × FocusGainRate_Defender"
    notes: "Defender focus compensation per hit received. ~1/3 of attacker rate."
    added: 2026-05-23
    revised: ""

  - name: unlock_threshold
    status: active
    source: design/gdd/focus-system.md
    referenced_by:
      - design/gdd/focus-system.md
    variables:
      - FocusBaseThreshold
      - FocusThresholdGrowth
      - n
    output_range: [40.0, 55.0]
    expression: "UnlockThreshold_n = FocusBaseThreshold + (n × FocusThresholdGrowth)"
    notes: "Increasing unlock threshold per skill unlock. n = number of skills already unlocked this match."
    added: 2026-05-23
    revised: ""

  - name: focus_update_and_unlock
    status: active
    source: design/gdd/focus-system.md
    referenced_by:
      - design/gdd/focus-system.md
      - design/gdd/skill-draw-system.md
    variables:
      - FocusPoints_old
      - FocusGain
      - FocusCap
      - UnlockThreshold_n
      - UnlockedCount
      - MaxSkillsPerMatch
    output_range: "[0.0, FocusCap] for FocusPoints; [0, MaxSkillsPerMatch] for UnlockedCount"
    expression: "FocusPoints_new = Min(FocusPoints_old + FocusGain, FocusCap); if >= Threshold and < Max: trigger unlock, subtract threshold"
    notes: "Core focus update logic. Triggers OnFocusReady when threshold reached. Output feeds into skill-draw-system and HUD."
    added: 2026-05-23
    revised: ""

  - name: skill_draw_weight
    status: active
    source: design/gdd/skill-database.md
    referenced_by:
      - design/gdd/skill-database.md
      - design/gdd/skill-draw-system.md
    variables:
      - RarityPoolWeight
      - RarityPoolTotalWeight
      - SkillRarityWeight
    output_range: [0.0, 1.0]
    expression: "SkillDrawWeight = (RarityPoolWeight / RarityPoolTotalWeight) × SkillRarityWeight"
    notes: "Per-skill draw probability. RarityPoolWeight is the tier chance (Common=0.7, Rare=0.2, Epic=0.1). Used by skill-draw-system."
    added: 2026-05-23
    revised: ""

  - name: pool_weight_recompute
    status: active
    source: design/gdd/skill-draw-system.md
    referenced_by:
      - design/gdd/skill-draw-system.md
    variables:
      - RarityPoolWeight
      - RarityPoolCount_inPool
      - SkillRarityWeight
    output_range: [0.0, 1.0]
    expression: "PoolWeight_i = (RarityPoolWeight / RarityPoolCount_inPool) × SkillRarityWeight; DrawWeight_i = PoolWeight_i / Sum(PoolWeight_j)"
    notes: "Class-filtered pool weight recomputation. RarityPoolCount_inPool is the count of skills in that rarity tier within the class pool. Normalization handles empty tiers."
    added: 2026-05-23
    revised: ""

  - name: candidate_selection
    status: active
    source: design/gdd/skill-draw-system.md
    referenced_by:
      - design/gdd/skill-draw-system.md
    variables:
      - EligiblePool
      - PoolSize
      - DrawWeight
    output_range: "[1, 3] unique SkillData"
    expression: "For k=1..min(3,PoolSize): P(skill_i) = DrawWeight_i / Sum(remaining); draw Candidate_k; remove from pool"
    notes: "Weighted random without replacement. Generates 3 candidates for player selection. Degraded mode when PoolSize < 3."
    added: 2026-05-23
    revised: ""

  - name: pool_exhaustion_check
    status: active
    source: design/gdd/skill-draw-system.md
    referenced_by:
      - design/gdd/skill-draw-system.md
    variables:
      - PoolSize
    output_range: "[true, false]"
    expression: "CanDraw = (PoolSize >= 1); CandidateCount = min(3, PoolSize)"
    notes: "Determines if draw can proceed and how many candidates to show."
    added: 2026-05-23
    revised: ""

  - name: remaining_pool_size
    status: active
    source: design/gdd/skill-draw-system.md
    referenced_by:
      - design/gdd/skill-draw-system.md
    variables:
      - InitialPoolSize
      - n
    output_range: "[0, InitialPoolSize]"
    expression: "RemainingPoolSize_n = InitialPoolSize - n"
    notes: "Tracks remaining skills in pool after n successful draws. n = UnlockedCount."
    added: 2026-05-23
    revised: ""

  - name: wins_needed
    status: active
    source: design/gdd/match-management-system.md
    referenced_by:
      - design/gdd/match-management-system.md
    variables:
      - MatchFormat
    output_range: [1, 3]
    expression: "WinsNeeded = Ceil(MatchFormat / 2.0)"
    notes: "Derives win threshold from match format. Bo1=1, Bo3=2, Bo5=3."
    added: 2026-05-23
    revised: ""

  - name: match_over_check
    status: active
    source: design/gdd/match-management-system.md
    referenced_by:
      - design/gdd/match-management-system.md
    variables:
      - scores
      - WinsNeeded
    output_range: [false, true]
    expression: "IsMatchOver = (scores[0] >= WinsNeeded) OR (scores[1] >= WinsNeeded)"
    notes: "Checks if either player has won the match. Used after each round score update."
    added: 2026-05-23
    revised: ""

  - name: draw_check
    status: active
    source: design/gdd/match-management-system.md
    referenced_by:
      - design/gdd/match-management-system.md
    variables:
      - scores
      - WinsNeeded
    output_range: [false, true]
    expression: "IsDraw = (scores[0] >= WinsNeeded) AND (scores[1] >= WinsNeeded)"
    notes: "Checks if both players simultaneously reached win threshold (double KO scenario)."
    added: 2026-05-23
    revised: ""

  - name: max_rounds
    status: active
    source: design/gdd/match-management-system.md
    referenced_by:
      - design/gdd/match-management-system.md
    variables:
      - WinsNeeded
    output_range: [1, 5]
    expression: "MaxRounds = (WinsNeeded × 2) - 1"
    notes: "Maximum rounds without double KO. Bo1=1, Bo3=3, Bo5=5."
    added: 2026-05-23
    revised: ""

